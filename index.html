<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f2">
<meta name="description" content="Horizons — planifier du jour à la vie : objectifs par horizon, tableaux, calendrier, ascensions.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Horizons">
<title>Horizons</title>
<link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Navigation"></aside>
  <div class="sb-scrim" id="sbScrim"></div>
  <div class="content">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Menu"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <b id="topTitle">Horizons</b>
      <button class="icon-btn" id="topSearch" aria-label="Rechercher"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
      <button class="icon-btn accent" id="topAdd" aria-label="Nouvel élément"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-h"><h2 id="sheetTitle"></h2><button class="icon-btn" id="sheetClose" aria-label="Fermer"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <div class="sheet-b" id="sheetBody"></div>
</aside>
<div class="dialog" id="dialog" hidden></div>
<div class="menu" id="menu" hidden role="menu"></div>
<div class="due" id="due" hidden role="status"></div>
<div class="toast" id="toast" hidden role="status"><span id="toastMsg"></span><button id="toastAct" hidden>Annuler</button></div>
<noscript><p style="padding:24px;font-family:sans-serif">Horizons a besoin de JavaScript.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
