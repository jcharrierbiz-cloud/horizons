# Publie l'application sur GitHub Pages à chaque envoi sur main.
# Prérequis : Settings → Pages → Source : « GitHub Actions ».
# Sur un compte gratuit, GitHub Pages n'existe que pour un dépôt public : tant
# que le dépôt est privé, la publication automatique attend sans échouer. Avec
# un compte payant, on peut la lancer à la main (Actions → Run workflow).
name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Préparer le site (sans les tests ni la configuration)
        run: |
          mkdir _site
          cp -r index.html app.css sw.js manifest.webmanifest icon* fonts js _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
